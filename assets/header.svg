    <text x="78" y="350" fill="#93ADC5" font-size="15">Warsaw, Poland</text>
    <path d="M226 339V353" stroke="#35506A"/>
    <text x="244" y="350" fill="#93ADC5" font-size="15">APIs · Data integrity · Product workflows</text>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="712.5" y="35.5" width="439" height="329" rx="16" fill="#0B1422" fill-opacity="0.84" stroke="#2B4058"/>
