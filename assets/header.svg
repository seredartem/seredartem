<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Artem Sereda — Python Backend Developer</title>
  <desc id="description">Backend engineering and full-stack development. FastAPI, PostgreSQL, React and TypeScript. SPLASH combines client and owner interfaces, booking and membership services, authentication, database transactions and migrations. Based in Warsaw, Poland.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220"/>
      <stop offset="1" stop-color="#142137"/>
    </linearGradient>
    <linearGradient id="accent" x1="56" y1="0" x2="1144" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0.25"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#90B2C8" stroke-opacity="0.045"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1L6 4L1 7" stroke="#5EEAD4" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="400" rx="20" fill="url(#background)"/>
  <rect x="696" width="504" height="400" rx="20" fill="url(#grid)"/>
  <path d="M56 1H1144" stroke="url(#accent)" stroke-width="2"/>
