    <text x="53" y="143" fill="#F1F5F9" font-size="64" font-weight="700" letter-spacing="0.8">ARTEM SEREDA</text>
    <text x="56" y="188" fill="#C5D5E5" font-size="30">Python Backend Developer</text>
    <text x="56" y="236" fill="#B0C3D7" font-size="20">I turn business rules into working software.</text>
    <g font-size="15" font-weight="500" text-anchor="middle">
      <rect x="56.5" y="263.5" width="102" height="33" rx="7" fill="#113238" stroke="#2E6C6B"/>
